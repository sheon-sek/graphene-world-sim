[project]
name = "gws-opcua"
version = "0.0.0"
description = "OPC UA exposure of simulated points, driven only by point bindings."
requires-python = ">=3.12"
dependencies = ["asyncua>=1.1.5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gws_opcua"]
